[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homelabctl"
version = "0.1.0"
description = "A small, declarative service manager for personal servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9,<8",
  "PyYAML>=6.0,<7",
  "qrcode>=8.2,<9",
  "textual>=8.2,<9",
]

[project.scripts]
homelabctl = "homelabctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homelabctl = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

