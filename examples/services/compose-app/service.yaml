apiVersion: homelabctl/v1alpha1
kind: Service
metadata:
  name: compose-app
  description: Docker Compose 应用示例
spec:
  driver: compose
  workingDirectory: .
  compose:
    file: compose.yaml
  config:
    files:
      - compose.yaml
      - .env
  backup:
    paths:
      - data/
    exclude:
      - data/cache/

